<!DOCTYPE html>
<html>


<head>
<title>Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&family=Italianno&family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Montserrat:ital,wght@0,513;1,513&family=Nunito:ital,wght@0,650;1,650&display=swap" rel="stylesheet">
<link rel="stylesheet" href="usefulstyles.css">
<style> 

.hero {
  position: relative;
  width: 100%;
}

.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(to bottom, rgba(0, 0, 0, 0.8), transparent 80%);
}

.firstImg {
  display: block;
  width: 100%;
  height: auto;
  position: relative;
  z-index: 0;
  
}

.hero-content {
  position: absolute;
  inset: 0;
  z-index: 2;
}

.word {
  display: inline-block;
  opacity: 0;
  animation-fill-mode: forwards;
  animation: wordMove 2s forwards;
}

.elite {
  --x: 8vw;
  animation-delay: 0.9s;
}

.furniture {
  --x: 8vw;
  animation-delay: 1.5s;
}

.interiors {
  --x: 8vw;
  animation-delay: 1.8s;
}

@keyframes wordMove {
  to {transform: translateX(var(--x)); opacity: 1;}
}

</style>
</head>


<body style="background-color:#ffffff;">

<!-- Navigation Bar -->

<div class ="navbar">
<a href="index.html" class="navlink">Home</a>
<a href="index.html" class="navlink">About EFI</a>
<a href="index.html" class="navlink">Our Services</a>
<a href="index.html" class="navlink">Contact Us</a>
<a href="index.html" class="navlink">Project Showcase</a>
<a href="index.html" class="navlink">Staff</a>
<a href="index.html" class="navlink">Request a Quote</a>

</div>





<section class="hero">
  <img class="firstImg" src="NewHEROimg.jpeg" alt="Furniture showroom"/>
  <div class="hero-content">
    <!-- Logo and Name -->
    <img src="WhiteCenterAltLogoEFI.png" style="float:left;width:20%;height:auto;margin-left:5vw;margin-top:14em; z-index: 1;"/>
    <p class="companyname" style="margin-top:2.5em">
      <span class="word elite">ELITE</span><br>
      <span class="word furniture">FURNITURE</span><br>
      <span class="word interiors">INTERIORS</span>
    </p>

    <div style="margin-left:33.5%">
      <div class="subtext">Quality is our Signature</div>
      <hr width="40%" style="border: 1px solid #eebe00; margin-top: 0em; margin-left: 0;"/>
    </div>  
  </div>
</section>



  
</body>
</html>
